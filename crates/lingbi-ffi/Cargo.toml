[package]
name = "lingbi-ffi"
version = "0.1.0"
edition = "2024"

[dependencies]
flutter_rust_bridge = "=2.12.0"
lingbi-application = { path = "../lingbi-application" }
lingbi-contracts = { path = "../lingbi-contracts" }
lingbi-domain = { path = "../lingbi-domain" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lib]
crate-type = ["cdylib", "rlib"]
