[package]
name = "lingbi-import-export"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lingbi-application = { path = "../lingbi-application" }
lingbi-contracts = { path = "../lingbi-contracts" }
lingbi-domain = { path = "../lingbi-domain" }
lingbi-storage = { path = "../lingbi-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
