[package]
name = "lingbi-application"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["std"] }
lingbi-ai = { path = "../lingbi-ai" }
lingbi-contracts = { path = "../lingbi-contracts" }
lingbi-domain = { path = "../lingbi-domain" }
lingbi-mutation = { path = "../lingbi-mutation" }
lingbi-security = { path = "../lingbi-security" }
lingbi-storage = { path = "../lingbi-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
