[package]
name = "lingbi-security"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
lingbi-contracts = { path = "../lingbi-contracts" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
