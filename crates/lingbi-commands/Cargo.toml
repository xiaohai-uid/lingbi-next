[package]
name = "lingbi-commands"
version = "0.1.0"
description = "P4 command layer — Book V3 single boundary (16 commands)"
edition = "2021"

[dependencies]
lingbi-book = { path = "../lingbi-book" }
lingbi-contracts = { path = "../lingbi-contracts" }
lingbi-recovery = { path = "../lingbi-recovery" }
lingbi-storage = { path = "../lingbi-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
