[package]
name = "lingbi-book"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
lingbi-contracts = { path = "../lingbi-contracts" }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
