[package]
name = "lingbi-writing"
version = "0.1.0"
edition = "2024"

[dependencies]
lingbi-ai = { path = "../lingbi-ai" }
lingbi-contracts = { path = "../lingbi-contracts" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
