[package]
name = "lingbi-e2e-desktop-real"
version = "0.1.0"
edition = "2024"
description = "Real LingBi desktop binary E2E driven through tauri-driver (Windows product E2E + Linux compat)"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"

# NOTE: this crate intentionally depends only on the production release
# binary it drives. It must not depend on lingbi crates: the E2E has to
# prove the real binary + real IPC + real Rust Core, not in-process code.
