[package]
name = "lingbi-e2e-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
lingbi-ai = { path = "../../crates/lingbi-ai" }
lingbi-contracts = { path = "../../crates/lingbi-contracts" }
lingbi-application = { path = "../../crates/lingbi-application" }
lingbi-domain = { path = "../../crates/lingbi-domain" }
lingbi-mutation = { path = "../../crates/lingbi-mutation" }
lingbi-recovery = { path = "../../crates/lingbi-recovery" }
lingbi-storage = { path = "../../crates/lingbi-storage" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
