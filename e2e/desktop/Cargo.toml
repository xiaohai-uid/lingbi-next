[package]
name = "lingbi-e2e-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lingbi-ai = { path = "../../crates/lingbi-ai" }
lingbi-application = { path = "../../crates/lingbi-application" }
lingbi-domain = { path = "../../crates/lingbi-domain" }
lingbi-mutation = { path = "../../crates/lingbi-mutation" }
lingbi-recovery = { path = "../../crates/lingbi-recovery" }
lingbi-storage = { path = "../../crates/lingbi-storage" }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
