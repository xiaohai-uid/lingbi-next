# LingBi Next Release Gates
#
# Windows is the P0 product platform. The product cannot advance to Public
# Beta until the Windows Product Gate passes end to end.
#
#   windows-core-gate     → the only product Release Gate. Any step failure
#                           prints "Windows Product Gate = FAIL".
#   windows-desktop-e2e   → real Windows Tauri binary E2E (tauri-driver +
#                           Edge WebDriver/WebView2). Explicit execution,
#                           never skipped. passed > 0, failed = 0,
#                           skipped = 0 required.
#   linux-portability     → cross-platform Core/Web portability only.
#
# IMPORTANT:
#   Linux PASS ≠ Windows Product PASS.
#   Linux portability is a secondary signal: it can block a Core merge, but
#   it never authorizes a product release. See docs/qa/release-gates.md.

name: LingBi Next Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lingbi-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core-gate:
    name: Windows Product Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Rust format, clippy, tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --exclude lingbi-e2e-desktop-real
        shell: pwsh

      - name: Go tests and vet
        run: |
          cd services/cloud
          go test ./...
          go vet ./...
        shell: pwsh

      - name: Frontend tests and web build
        run: |
          pnpm install
          cd apps/desktop
          pnpm test
          pnpm build
        shell: pwsh

      # Must run after the frontend build: tauri::generate_context!()
      # embeds frontendDist (../dist) and the proc macro panics when the
      # directory does not exist yet.
      - name: Desktop shell format, clippy, unit tests
        run: |
          cd apps/desktop/src-tauri
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
        shell: pwsh

      - name: Tauri release build (real Windows installer artifact)
        run: |
          cd apps/desktop
          pnpm tauri build
        shell: pwsh

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: lingbi-next-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Windows Product Gate result
        if: ${{ failure() }}
        run: |
          Write-Host "=============================================="
          Write-Host "Windows Product Gate = FAIL"
          Write-Host "=============================================="
          exit 1
        shell: pwsh

  windows-desktop-e2e:
    name: Windows Desktop E2E
    runs-on: windows-latest
    needs: windows-core-gate
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend deps
        run: pnpm install
        shell: pwsh

      - name: Build real Tauri release binary
        run: |
          cd apps/desktop
          pnpm tauri build
        shell: pwsh

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
        shell: pwsh

      - name: Download version-matched Edge WebDriver
        shell: pwsh
        run: |
          # The preinstalled SeleniumWebDrivers msedgedriver does NOT match
          # the runner's Edge version, which makes tauri-driver hang on
          # POST /session (verified locally: a version-matched driver from
          # msedgedriver.microsoft.com passes the full golden path).
          $edge = (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe').VersionInfo.ProductVersion
          Write-Host "Edge version: $edge"
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'edgedriver') -Force
          $driver = Join-Path $env:RUNNER_TEMP 'edgedriver/msedgedriver.exe'
          if (-not (Test-Path $driver)) { Write-Host 'msedgedriver download failed'; exit 1 }
          "LINGBI_EDGE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "msedgedriver ready: $driver"

      - name: Diagnose session creation (full evidence)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $app = Join-Path (Get-Location) 'apps/desktop/src-tauri/target/release/lingbi-desktop.exe'
          Write-Host "app: $app exists=$(Test-Path $app)"

          # ---------- 1) versions & runtimes ----------
          $edge = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Write-Host "edge=$edge"
          Write-Host "driverVer=$(& $env:LINGBI_EDGE_DRIVER --version 2>&1)"
          try {
            $crates = Select-String -Path "$env:CARGO_HOME\.crates.toml" -Pattern 'tauri-driver'
            Write-Host "tauriDriver=$($crates.Line.Trim())"
          } catch { Write-Host 'tauriDriver=unknown' }
          $wv2 = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if ($wv2) { Write-Host "webview2Runtime(HKLM)=$($wv2.pv)" } else { Write-Host 'webview2Runtime(HKLM)=MISSING' }
          $wv2u = Get-ItemProperty 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if ($wv2u) { Write-Host "webview2Runtime(HKCU)=$($wv2u.pv)" } else { Write-Host 'webview2Runtime(HKCU)=none' }
          Get-ChildItem Env: | Where-Object { $_.Name -like 'WEBVIEW2*' } | ForEach-Object { Write-Host "env $($_.Name)=$($_.Value)" }

          # ---------- 2) standalone app: window + webview2 children ----------
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          Write-Host "app.alive=$(-not $p.HasExited) mainWindow='$($p.MainWindowTitle)' handle=$($p.MainWindowHandle)"
          $wv2procs = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
          Write-Host "webview2procCount=$($wv2procs.Count)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          # ---------- 3) tauri-driver session, with curl + process probes ----------
          $out = Join-Path $env:RUNNER_TEMP 'td-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'td-err.log'
          $td = Start-Process -FilePath 'tauri-driver' -ArgumentList '--port','4455','--native-port','4456','--native-driver', $env:LINGBI_EDGE_DRIVER -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 4
          try { Invoke-RestMethod 'http://127.0.0.1:4455/status' -TimeoutSec 5 | Out-Null; Write-Host 'tdStatus: OK' }
          catch { Write-Host "tdStatus: FAIL $_" }
          $nativeAlive = @(Get-Process msedgedriver -ErrorAction SilentlyContinue)
          Write-Host "msedgedriverAlive=$($nativeAlive.Count) pid=$($nativeAlive.Id -join ',')"
          if ($nativeAlive.Count -gt 0) {
            try { Invoke-RestMethod 'http://127.0.0.1:4456/status' -TimeoutSec 5 | Out-Null; Write-Host 'nativeStatus: OK' }
            catch { Write-Host "nativeStatus: FAIL $_" }
          }
          $body = @{ capabilities = @{ alwaysMatch = @{ 'tauri:options' = @{ application = $app; args = @() } } } } | ConvertTo-Json -Depth 6
          $curlOut = Join-Path $env:RUNNER_TEMP 'curl-body.txt'
          Write-Host '--- curl POST /session via tauri-driver (cap 30s) ---'
          & curl.exe --max-time 30 -sS -w "HTTP_CODE=%{http_code} TIME=%{time_total}`n" -D - -X POST 'http://127.0.0.1:4455/session' -H 'Content-Type: application/json' --data $body -o $curlOut 2>&1 | Select-Object -First 25
          Write-Host "curlExit=$LASTEXITCODE"
          Write-Host '--- curl response body ---'
          Get-Content $curlOut -ErrorAction SilentlyContinue | Select-Object -First 15
          $apps = @(Get-Process lingbi-desktop -ErrorAction SilentlyContinue)
          Write-Host "lingbiProcsAfterTd=$($apps.Count)"
          $apps | ForEach-Object { Write-Host "  pid=$($_.Id) title='$($_.MainWindowTitle)'" }
          $wv2 = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
          Write-Host "webview2ProcsAfterTd=$($wv2.Count)"
          $wv2 | ForEach-Object { Write-Host "  wv2pid=$($_.Id)" }
          Write-Host '--- netstat 4455/4456 ---'
          netstat -ano | Select-String '4455|4456' | Select-Object -First 12

          # ---------- 4) bypass tauri-driver: direct msedgedriver with verbose logs ----------
          # Stop tauri-driver first (it owns a msedgedriver on 4456)
          Stop-Process -Id $td.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          Get-Process lingbi-desktop,msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $drvOut = Join-Path $env:RUNNER_TEMP 'driver-out.log'
          $drvErr = Join-Path $env:RUNNER_TEMP 'driver-err.log'
          $native = Start-Process -FilePath $env:LINGBI_EDGE_DRIVER -ArgumentList '--port=4456','--host=127.0.0.1','--verbose' -RedirectStandardOutput $drvOut -RedirectStandardError $drvErr -PassThru
          Start-Sleep -Seconds 4
          try { Invoke-RestMethod 'http://127.0.0.1:4456/status' -TimeoutSec 5 | Out-Null; Write-Host 'directNativeStatus: OK' }
          catch { Write-Host "directNativeStatus: FAIL $_" }
          $nativeBody = @{ capabilities = @{ alwaysMatch = @{ 'ms:edgeOptions' = @{ binary = $app; args = @() }; 'ms:edgeChromium' = $true; 'browserName' = 'webview2' } } } | ConvertTo-Json -Depth 8 -Compress
          $bodyFile = Join-Path $env:RUNNER_TEMP 'native-body.json'
          Set-Content -Path $bodyFile -Value $nativeBody -Encoding utf8
          $curlOut2 = Join-Path $env:RUNNER_TEMP 'curl-body2.txt'
          Write-Host '--- curl POST /session directly to native driver (cap 60s) ---'
          $curlNative = Start-Process -FilePath 'curl.exe' -ArgumentList '--max-time','60','-sS','-w','HTTP_CODE=%{http_code} TIME=%{time_total}','-X','POST','http://127.0.0.1:4456/session','-H','Content-Type: application/json','--data',"@$bodyFile" -PassThru
          Start-Sleep -Seconds 12
          # probe the app's real command line + CDP port while the session hangs
          $appProcs = Get-CimInstance Win32_Process -Filter "Name='lingbi-desktop.exe'" -ErrorAction SilentlyContinue
          $appProcs | ForEach-Object { Write-Host "appCmdLine: $($_.CommandLine)" }
          $cdpPort = ''
          foreach ($ap in $appProcs) { if ($ap.CommandLine -match 'remote-debugging-port=(\d+)') { $cdpPort = $matches[1]; break } }
          Write-Host "cdpPort=$cdpPort"
          if ($cdpPort) {
            netstat -ano | Select-String ":$cdpPort " | Select-Object -First 6
            Write-Host '--- curl CDP /json/version ---'
            & curl.exe --max-time 5 -sS "http://127.0.0.1:$cdpPort/json/version" 2>&1 | Select-Object -First 5
          }
          Wait-Process -Id $curlNative.Id -Timeout 80 -ErrorAction SilentlyContinue
          Write-Host "curlNativeExit=$($curlNative.ExitCode)"
          Write-Host '--- native response body ---'
          Get-Content $curlOut2 -ErrorAction SilentlyContinue | Select-Object -First 15
          Stop-Process -Id $native.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          Write-Host '--- msedgedriver stdout (verbose) ---'
          Get-Content $drvOut -ErrorAction SilentlyContinue | Select-Object -Last 60
          Write-Host '--- msedgedriver stderr ---'
          Get-Content $drvErr -ErrorAction SilentlyContinue | Select-Object -Last 30
          Write-Host '--- tauri-driver stdout ---'
          Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 30
          Write-Host '--- tauri-driver stderr ---'
          Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 30

      - name: Run real Windows desktop E2E (explicit, never skipped)
        run: |
          $output = cargo test -p lingbi-e2e-desktop-real --test windows_desktop_e2e -- --test-threads=1 2>&1
          $output | Select-Object -Last 60
          $summary = ($output | Select-String 'test result:').Line
          Write-Host "=============================================="
          Write-Host "Windows Desktop E2E summary: $summary"
          $passed = 0; $failed = 0; $skipped = 0
          if ($summary -match '(\d+) passed') { $passed = [int]$matches[1] }
          if ($summary -match '(\d+) failed') { $failed = [int]$matches[1] }
          if ($summary -match '(\d+) ignored') { $skipped = [int]$matches[1] }
          Write-Host "Windows Desktop E2E passed=$passed failed=$failed skipped=$skipped"
          if ($passed -lt 1 -or $failed -ne 0 -or $skipped -ne 0) {
            Write-Host "Windows Desktop E2E = FAIL (need passed > 0, failed = 0, skipped = 0)"
            exit 1
          }
          Write-Host "Windows Desktop E2E = PASS"
          exit 0
        shell: pwsh

  linux-portability:
    name: Linux Portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Linux only protects cross-platform Core merges. It does NOT approve
      # a product release: Linux PASS ≠ Windows Product PASS.
      - name: Rust core compile
        run: cargo build --workspace --exclude lingbi-e2e-desktop-real

      - name: Rust unit tests
        run: cargo test --workspace --exclude lingbi-e2e-desktop-real

      - name: Go tests
        run: |
          cd services/cloud
          go test ./...

      - name: Web build
        run: |
          pnpm install
          cd apps/desktop
          pnpm test
          pnpm build
          cd ../website
          pnpm test
          pnpm build
